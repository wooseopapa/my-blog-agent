<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 블로그 7단계 에이전트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f6f7; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #03cf5d; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        button { padding: 15px 25px; background: #03cf5d; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #02b34f; }
        #loading { display: none; text-align: center; font-weight: bold; color: #666; margin: 20px 0; }
        #resultContainer { display: none; margin-top: 30px; }
        textarea { width: 100%; height: 300px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; box-sizing: border-box; }
        .copy-btn { width: 100%; margin-top: 10px; background: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 블로그 에이전트 파이프라인</h1>
    <p style="text-align:center; color:#666;">키워드를 입력하면 7단계 에이전트가 작동하여 네이버용 HTML을 생성합니다.</p>
    
    <div class="input-group">
        <input type="text" id="keywordInput" placeholder="예: 초보 러너 5km 훈련, 전세사기 예방 체크리스트">
        <button onclick="generateBlog()">초안 생성</button>
    </div>

    <div id="loading">🤖 에이전트들이 분석 및 근거 수집, 본문 작성을 진행 중입니다... (약 10~20초 소요)</div>

    <div id="resultContainer">
        <h3>🎉 생성 완료! 아래 HTML 코드를 전체 복사해서 네이버 에디터에 붙여넣으세요.</h3>
        <textarea id="resultArea" readonly></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">📋 결과 코드 복사하기</button>
    </div>
</div>

<script>
    async function generateBlog() {
        const keyword = document.getElementById('keywordInput').value;
        if(!keyword) return alert('키워드를 입력해주세요!');

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultContainer').style.display = 'none';

        try {
            // 방금 만든 Vercel API 엔드포인트를 호출합니다.
            const response = await fetch('/api/blog-v2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: keyword })
            });

            const data = await response.json();
            
            if(data.success) {
                document.getElementById('resultArea').value = data.result;
                document.getElementById('resultContainer').style.display = 'block';
            } else {
                alert('에러 발생: ' + (data.error || '알 수 없는 오류'));
            }
        } catch(e) {
            alert('서버 연결 실패: ' + e.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function copyToClipboard() {
        const copyText = document.getElementById('resultArea');
        copyText.select();
        document.execCommand('copy');
        alert('코드가 클립보드에 복사되었습니다! 네이버 블로그 글쓰기(HTML 모드 등)에 붙여넣으세요.');
    }
</script>

</body>
</html>
